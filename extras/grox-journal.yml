# OPSIONAL. Salin ke repo grox sebagai .github/workflows/grox-journal.yml
# dan salin extras/grox-scan.mts ke grox/scripts/grox-scan.mts.
# Menulis data/journal.json (format sama dengan mesin lain) memakai engine grox (src/lib/engine) apa adanya.
# BELUM DIUJI terhadap jaringan Binance; skrip hanya memanggil fungsi engine yang sudah ada.
name: Jurnal grox
on:
  workflow_dispatch:
  schedule: [{ cron: '12 */4 * * *' }]
permissions: { contents: write }
concurrency: { group: grox-journal, cancel-in-progress: false }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Scan dan tulis data/journal.json
        run: node --experimental-strip-types scripts/grox-scan.mts
      - name: Commit data
        run: |
          git config user.name "journal-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -m "journal: scan $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep $((i*5)); done
          exit 1
# Agar data/journal.json terbit di https://<owner>.github.io/grox/data/journal.json, workflow deploy.yml grox
# harus menyalin folder data/ ke hasil build (dist/). Tanpa itu, file hanya ada di repo.
